{% extends "gestionepi/base.html" %}
{% block titre %}{{ titre }}{% endblock %}
{% block contenu %}
<h2 class="mb-4">{{ titre }}</h2>
<div class="card card-indicateur p-4" style="max-width:600px;">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn text-white" style="background-color:#053724;">Enregistrer</button>
        <a href="{% url 'liste_employes' %}" class="btn btn-outline-secondary"style="background-color:#053724;">Annuler</a>
    </form>
</div>
{% endblock %}
